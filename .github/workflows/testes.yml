# [IA] registro 4
name: Testes do projeto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Conferir dependências
        run: python -m pip check
      - name: Obter os cinco CSVs públicos para os testes reais
        run: python scripts/baixar_dados.py
      - name: Verificar sintaxe
        run: python -m compileall -q src scripts pages app.py tests
      - name: Executar testes
        run: python -m pytest -q
